<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A curated gallery of photographs from Africa.">
  <title>Africa 2026 · Photo Collection</title>
  <style>
    :root{--paper:#f4efe5;--cream:#f8f3e9;--ink:#201d18;--muted:#71695e;--line:#d8cebc;--rust:#9b4a2f;--shadow:#c9b998}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    button,input{font:inherit}button{color:inherit}.top{position:sticky;top:0;z-index:20;border-bottom:1px solid var(--line);background:rgba(248,243,233,.95);backdrop-filter:blur(12px);padding:20px clamp(20px,4vw,64px)}
    .head{max-width:1600px;margin:auto;display:flex;align-items:flex-end;justify-content:space-between;gap:30px}.eyebrow{margin:0 0 8px;color:var(--rust);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.28em}
    h1{margin:0;font-family:Georgia,serif;font-size:clamp(38px,5vw,58px);line-height:.95;letter-spacing:-.04em}.sub{margin:10px 0 0;color:var(--muted);font-size:14px}
    .search{display:flex;align-items:center;gap:10px;width:min(320px,100%);height:44px;padding:0 14px;border:1px solid #cfc4b2;background:white;box-shadow:3px 3px 0 #d9c8a8}.search svg{width:17px;color:#8a8175}.search input{width:100%;border:0;outline:0;background:transparent}.clear{border:0;background:transparent;cursor:pointer;color:var(--muted);font-size:20px}
    main{max-width:1600px;margin:auto;padding:24px clamp(20px,4vw,64px) 70px}.meta{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:20px;color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.16em}
    .grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:30px 20px}.card{border:0;padding:0;background:transparent;text-align:left;cursor:pointer}.frame{display:block;aspect-ratio:4/3;overflow:hidden;background:#ddd4c5;box-shadow:3px 3px 0 var(--shadow);transition:.25s}.frame img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}.card:hover .frame,.card:focus-visible .frame{transform:translateY(-4px);box-shadow:6px 7px 0 var(--shadow)}.card:hover img{transform:scale(1.03)}
    .caption{display:flex;justify-content:space-between;gap:10px;margin-top:12px}.name{overflow:hidden;text-overflow:ellipsis;font:11px ui-monospace,SFMono-Regular,Consolas,monospace;color:#655e54}.number{font-size:10px;font-weight:800;color:var(--rust)}
    .empty{min-height:45vh;display:grid;place-items:center;text-align:center;border:1px dashed #c8bcaa;background:#eee7da}.empty button{border:0;background:none;color:var(--rust);text-decoration:underline;cursor:pointer}
    .viewer{position:fixed;inset:0;z-index:100;display:grid;width:100vw;height:100dvh;place-items:center;background:#17130f;padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));touch-action:pan-y;user-select:none;overscroll-behavior:none}.viewer[hidden]{display:none}.viewer figure{margin:0;display:flex;height:100%;width:100%;flex-direction:column;align-items:center;justify-content:center;gap:12px}.viewer img{max-width:100%;max-height:calc(100dvh - 72px - env(safe-area-inset-top) - env(safe-area-inset-bottom));object-fit:contain;box-shadow:0 25px 70px #000}.viewer figcaption{color:#ffffffb3;font:12px ui-monospace,monospace}
    .icon{position:absolute;z-index:2;display:grid;place-items:center;width:48px;height:48px;border:0;border-radius:50%;background:#ffffff18;color:white;cursor:pointer;font-size:25px}.icon:hover{background:#ffffff30}.close{right:18px;top:18px}.prev{left:18px;top:50%}.next{right:18px;top:50%}
    @media(max-width:1100px){.grid{grid-template-columns:repeat(4,1fr)}}@media(max-width:800px){.head{align-items:stretch;flex-direction:column}.search{width:100%}.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:540px){.top{position:relative}.grid{grid-template-columns:repeat(2,1fr);gap:24px 12px}.meta span:last-child{display:none}.icon{width:42px;height:42px}.prev{left:8px}.next{right:8px}}
  </style>
</head>
<body>
  <header class="top"><div class="head"><div><p class="eyebrow">Photo collection</p><h1>Africa · 2026</h1><p class="sub">A curated selection of <span id="total">157</span> photographs</p></div><label class="search" aria-label="Search photographs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><input id="search" type="search" placeholder="Search by image number"><button id="clear" class="clear" aria-label="Clear search" hidden>×</button></label></div></header>
  <main><div class="meta"><span id="count">Loading images…</span><span>Click to enlarge</span></div><div id="grid" class="grid"></div><div id="empty" class="empty" hidden><div><p>No matching photographs</p><button id="showAll">Show all images</button></div></div></main>
  <div id="viewer" class="viewer" role="dialog" aria-modal="true" aria-label="Photograph viewer" hidden><button class="icon close" aria-label="Close viewer">×</button><button class="icon prev" aria-label="Previous image">‹</button><figure><img id="large" alt=""><figcaption id="position"></figcaption></figure><button class="icon next" aria-label="Next image">›</button></div>
  <script>
    const state={all:[],shown:[],active:-1,touchX:0,touchY:0};
    const grid=document.querySelector('#grid'),search=document.querySelector('#search'),clear=document.querySelector('#clear'),count=document.querySelector('#count'),empty=document.querySelector('#empty'),viewer=document.querySelector('#viewer'),large=document.querySelector('#large'),position=document.querySelector('#position');
    const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    function render(){const q=search.value.trim().toLowerCase();state.shown=state.all.filter(n=>n.toLowerCase().includes(q));count.textContent=`${state.shown.length} images`;clear.hidden=!q;empty.hidden=state.shown.length>0;grid.hidden=!state.shown.length;grid.innerHTML=state.shown.map((name,i)=>`<button class="card" data-i="${i}"><span class="frame"><img src="thumbs/${encodeURIComponent(name)}" alt="Africa photograph ${esc(name)}" loading="lazy"></span><span class="caption"><span class="name">${esc(name)}</span><span class="number">${String(i+1).padStart(3,'0')}</span></span></button>`).join('')}
    function openAt(i){state.active=(i+state.shown.length)%state.shown.length;const name=state.shown[state.active];large.src=`photos/${encodeURIComponent(name)}`;large.alt=`Africa photograph ${name}`;position.textContent=`${state.active+1} / ${state.shown.length} · ${name}`;viewer.hidden=false;document.body.style.overflow='hidden'}
    function enterFullscreen(){const request=viewer.requestFullscreen||viewer.webkitRequestFullscreen;if(request&&!document.fullscreenElement&&!document.webkitFullscreenElement)request.call(viewer)?.catch?.(()=>{})}
    function closeViewer(){viewer.hidden=true;large.src='';document.body.style.overflow='';const exit=document.exitFullscreen||document.webkitExitFullscreen;if((document.fullscreenElement||document.webkitFullscreenElement)&&exit)exit.call(document)?.catch?.(()=>{})}
    grid.addEventListener('click',e=>{const card=e.target.closest('.card');if(card){openAt(Number(card.dataset.i));enterFullscreen()}});search.addEventListener('input',render);clear.addEventListener('click',()=>{search.value='';render();search.focus()});document.querySelector('#showAll').addEventListener('click',()=>{search.value='';render()});document.querySelector('.close').addEventListener('click',closeViewer);document.querySelector('.prev').addEventListener('click',()=>openAt(state.active-1));document.querySelector('.next').addEventListener('click',()=>openAt(state.active+1));document.addEventListener('keydown',e=>{if(viewer.hidden)return;if(e.key==='Escape')closeViewer();if(e.key==='ArrowLeft')openAt(state.active-1);if(e.key==='ArrowRight')openAt(state.active+1)});
    viewer.addEventListener('touchstart',e=>{if(e.touches.length!==1)return;state.touchX=e.touches[0].clientX;state.touchY=e.touches[0].clientY},{passive:true});
    viewer.addEventListener('touchend',e=>{if(e.changedTouches.length!==1)return;const dx=e.changedTouches[0].clientX-state.touchX,dy=e.changedTouches[0].clientY-state.touchY;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.25)openAt(state.active+(dx<0?1:-1))},{passive:true});
    fetch('photos.json').then(r=>{if(!r.ok)throw new Error('Could not load image list');return r.json()}).then(names=>{state.all=names;document.querySelector('#total').textContent=names.length;render()}).catch(()=>{count.textContent='Unable to load images';empty.hidden=false;empty.querySelector('p').textContent='Please view this folder through GitHub Pages or a local web server.'});
  </script>
</body>
</html>
